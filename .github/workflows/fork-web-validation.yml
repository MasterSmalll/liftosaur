name: Fork Web Custom Metrics Validation

on:
  push:
    branches:
      - feature/custom-metrics-rir
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typescript-and-tests:
    name: Check TypeScript and workout analytics
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript typecheck
        run: npm run check
      - name: Custom metrics, MacroFactor, and dashboard tests
        run: npm run onetest -- test/customMetrics.test.ts test/importFromMacroFactor.test.ts test/importDuplicates.test.ts test/workoutHistoryDashboard.test.ts
