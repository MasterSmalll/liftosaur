name: Fork Web Custom Metrics Validation

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: fork-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typescript-and-tests:
    name: Check TypeScript and workout analytics
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate required local and markdown files
        run: npm run ensure:localdomain && npm run build:markdown
      - name: TypeScript typecheck
        run: npm run check
      - name: Custom metrics, MacroFactor, and dashboard tests
        run: npm run onetest -- test/customMetrics.test.ts test/importFromMacroFactor.test.ts test/importDuplicates.test.ts test/workoutHistoryDashboard.test.ts test/mcp.test.ts test/bodyweightPerformance.test.ts test/statRowWrites.test.ts

  chromium-browser:
    name: Chromium — real fork Web UI (no production sync)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate local build assets
        run: npm run ensure:localdomain && npm run build:markdown
      - name: Install Chromium and its system dependencies
        run: npx playwright install --with-deps chromium
      - name: Resolve local-only app domain to loopback
        run: |
          echo "127.0.0.1 local.liftosaur.com" | sudo tee -a /etc/hosts
          echo "127.0.0.1 local-api.liftosaur.com" | sudo tee -a /etc/hosts
      - name: Execute isolated Web UI validation in real Chromium
        run: npx playwright test --config=playwright.fork.config.ts
        env:
          CI: 'true'
      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fork-web-playwright-evidence
          path: |
            test-results/
            playwright-report/fork/
          if-no-files-found: ignore
          retention-days: 7
