name: Fork Web Custom Metrics Validation

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: fork-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typescript-and-tests:
    name: Check TypeScript and workout analytics
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate required local and markdown files
        run: npm run ensure:localdomain && npm run build:markdown
      - name: TypeScript typecheck
        run: npm run check
      - name: Custom metrics, MacroFactor, and dashboard tests
        run: npm run onetest -- test/customMetrics.test.ts test/importFromMacroFactor.test.ts test/importDuplicates.test.ts test/workoutHistoryDashboard.test.ts test/mcp.test.ts test/bodyweightPerformance.test.ts
